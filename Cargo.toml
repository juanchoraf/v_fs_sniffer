[package]
name = "v_fs_sniffer"
version = "0.1.7"
edition = "2021"
authors = ["TheVelasquez.com"]
description = "Deep filesystem sniffer for finding files, directories, strings, regex matches, and hidden clues."
license = "MIT"

[dependencies]
rustyline = { version = "18.0.1", default-features = false }
v_concat = "0.1.3"

[profile.dev]
codegen-units = 1

[profile.test]
codegen-units = 1

[profile.release]
codegen-units = 1
opt-level = 2
