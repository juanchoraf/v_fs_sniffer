name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.6"
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always
  V_FS_SNIFFER_GITHUB_REPO: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            shell: bash
            command: sh scripts/build_binaries_linux.sh --locked --no-update
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
            command: sh scripts/build_binaries_linux.sh --locked --no-update
          - name: macos-x86_64
            runner: macos-15-intel
            shell: bash
            command: sh scripts/build_binaries_macos.sh --locked --no-update
          - name: macos-arm64
            runner: macos-15
            shell: bash
            command: sh scripts/build_binaries_macos.sh --locked --no-update
          - name: windows-x86_64
            runner: windows-2025
            shell: pwsh
            command: .\scripts\build_binaries_windows.ps1 -Locked -NoUpdate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        shell: bash
        timeout-minutes: 10
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check tag matches Cargo version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | sed -n '1p')
          tag_version="${RELEASE_TAG#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "Cargo.toml version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Linux package tools
        if: startsWith(matrix.runner, 'ubuntu-')
        shell: bash
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build artifacts on Unix
        if: matrix.shell == 'bash'
        shell: bash
        timeout-minutes: 30
        run: ${{ matrix.command }}

      - name: Prepare Windows code signing certificate
        if: matrix.shell == 'pwsh'
        shell: pwsh
        timeout-minutes: 2
        env:
          V_FS_SNIFFER_CODESIGN_PFX_BASE64: ${{ secrets.V_FS_SNIFFER_CODESIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:V_FS_SNIFFER_CODESIGN_PFX_BASE64)) {
            Write-Host "No Windows code signing PFX secret configured."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "v_fs_sniffer_codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:V_FS_SNIFFER_CODESIGN_PFX_BASE64))
          "V_FS_SNIFFER_CODESIGN_PFX=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build artifacts on Windows
        if: matrix.shell == 'pwsh'
        shell: pwsh
        timeout-minutes: 30
        env:
          V_FS_SNIFFER_CODESIGN_PASSWORD: ${{ secrets.V_FS_SNIFFER_CODESIGN_PASSWORD }}
          V_FS_SNIFFER_CODESIGN_THUMBPRINT: ${{ secrets.V_FS_SNIFFER_CODESIGN_THUMBPRINT }}
          V_FS_SNIFFER_CODESIGN_TIMESTAMP_URL: ${{ secrets.V_FS_SNIFFER_CODESIGN_TIMESTAMP_URL }}
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v_fs_sniffer-${{ matrix.name }}
          path: versions/v_fs_sniffer_v*/v_fs_sniffer_v*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: v_fs_sniffer ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
